<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essencialmente | Painel</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#2d4327; --sage:#7a9b5c; --teal-text:#2f4f4a;
    --sage-light:#eef1e7; --cream:#faf8f3; --ink:#2b2b26;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); }
  header{ display:flex; align-items:center; justify-content:space-between; padding:20px 5vw; border-bottom:1px solid #e7e3d9; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:32px; height:32px; border-radius:50%; }
  .brand span{ font-family:'Fraunces', serif; font-size:1.2rem; color:var(--teal-text); }
  #btn-sair{ background:none; border:1px solid var(--forest); color:var(--forest); padding:8px 16px; border-radius:6px; cursor:pointer; display:none; }

  #login-box{ max-width:360px; margin:80px auto; padding:32px; background:#fff; border:1px solid #e7e3d9; border-radius:10px; }
  #login-box h2{ font-family:'Fraunces', serif; color:var(--forest); margin-bottom:20px; font-size:1.4rem; }
  #login-box input{ width:100%; padding:11px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; font-size:0.95rem; }
  #login-box button{ width:100%; padding:12px; background:var(--forest); color:#fff; border:none; border-radius:6px; font-size:0.95rem; cursor:pointer; }
  #login-erro{ color:#b3452c; font-size:0.85rem; margin-top:10px; display:none; }

  main{ display:none; padding:4vw 5vw; }
  main.ativo{ display:block; }
  .resumo{ font-size:0.9rem; color:#5c5c52; margin-bottom:24px; }
  table{ width:100%; border-collapse:collapse; background:#fff; }
  th, td{ text-align:left; padding:12px 14px; border-bottom:1px solid #eee; font-size:0.9rem; }
  th{ background:var(--sage-light); color:var(--teal-text); font-weight:600; }
  .estado{ padding:4px 10px; border-radius:20px; font-size:0.78rem; }
  .estado-confirmada{ background:#e2ecdb; color:#3c5a2f; }
  .estado-cancelada{ background:#f5dede; color:#8a3a3a; }
  .estado-realizada{ background:#e0e6f0; color:#3a4a6b; }
  #vazio{ color:#888; padding:30px 0; }
  tr.linha-consulta{ cursor:pointer; }
  tr.linha-consulta:hover{ background:var(--sage-light); }
  .badge-novo{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#c98a5e; margin-right:8px; }

  .modal-fundo{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .modal-fundo.ativo{ display:flex; }
  .modal-caixa{ background:#fff; border-radius:10px; padding:28px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal-caixa h3{ font-family:'Fraunces', serif; color:var(--forest); margin-bottom:18px; font-size:1.2rem; }
  .modal-linha{ margin-bottom:10px; font-size:0.92rem; }
  .modal-linha b{ color:var(--teal-text); }
  .modal-caixa textarea{ width:100%; min-height:110px; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:0.9rem; margin-top:6px; resize:vertical; }
  .modal-botoes{ display:flex; gap:10px; margin-top:16px; }
  .modal-botoes button{ padding:10px 18px; border-radius:6px; font-size:0.9rem; cursor:pointer; border:none; }
  #btn-guardar-nota{ background:var(--forest); color:#fff; }
  #btn-fechar-modal{ background:none; border:1px solid #ccc !important; color:var(--ink); }
  #msg-nota{ font-size:0.82rem; margin-top:8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="Essencialmente">
    <span>Painel — Essencial<em style="font-style:normal;">Mente</em></span>
  </div>
  <button id="btn-sair">Sair</button>
</header>

<div id="login-box">
  <h2>Entrar</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Palavra-passe">
  <button id="btn-entrar">Entrar</button>
  <p id="login-erro">Email ou palavra-passe incorretos.</p>
</div>

<main id="painel">
  <p class="resumo" id="resumo-utilizador"></p>

  <div id="bloco-admin" style="display:none; margin-bottom:32px; background:#fff; border:1px solid #e7e3d9; border-radius:10px; padding:24px; max-width:420px;">
    <h3 style="font-family:'Fraunces', serif; color:var(--forest); margin-bottom:16px; font-size:1.1rem;">Adicionar psicólogo</h3>
    <input type="text" id="novo-nome" placeholder="Nome" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px;">
    <input type="email" id="novo-email" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px;">
    <input type="password" id="novo-password" placeholder="Palavra-passe inicial" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px;">
    <input type="text" id="novo-especialidade" placeholder="Especialidade" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px;">
    <select id="novo-role" style="width:100%; padding:10px; margin-bottom:14px; border:1px solid #ccc; border-radius:6px;">
      <option value="psicologo">Psicólogo</option>
      <option value="admin">Administrador</option>
    </select>
    <button id="btn-criar-psicologo" style="width:100%; padding:11px; background:var(--forest); color:#fff; border:none; border-radius:6px; cursor:pointer;">Criar</button>
    <p id="msg-criar" style="font-size:0.85rem; margin-top:10px;"></p>
  </div>

  <div style="overflow-x:auto;">
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Hora</th>
        <th>Cliente</th>
        <th>Email</th>
        <th>Telefone</th>
        <th>Psicólogo</th>
        <th>Tipo</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="lista-consultas"></tbody>
  </table>
  </div>
  <p id="vazio" style="display:none;">Ainda não há consultas marcadas.</p>
</main>

<div class="modal-fundo" id="modal-fundo">
  <div class="modal-caixa">
    <h3>Detalhes da marcação</h3>
    <div class="modal-linha"><b>Cliente:</b> <span id="d-nome"></span></div>
    <div class="modal-linha"><b>Email:</b> <span id="d-email"></span></div>
    <div class="modal-linha"><b>Telefone:</b> <span id="d-telefone"></span></div>
    <div class="modal-linha"><b>Psicólogo:</b> <span id="d-psicologo"></span></div>
    <div class="modal-linha"><b>Tipo:</b> <span id="d-tipo"></span></div>
    <div class="modal-linha"><b>Data/Hora:</b> <span id="d-datahora"></span></div>
    <div class="modal-linha"><b>Estado:</b> <span id="d-estado"></span></div>

    <label style="font-size:0.9rem; font-weight:600; color:var(--teal-text); display:block; margin-top:16px;">
      Nota interna (só visível para a equipa)
    </label>
    <textarea id="d-nota" placeholder="Escreve aqui informações relevantes sobre este cliente para consulta futura..."></textarea>
    <p id="msg-nota"></p>

    <div class="modal-botoes">
      <button id="btn-guardar-nota">Guardar nota</button>
      <button id="btn-fechar-modal">Fechar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi-arHgDBIGpCCu50_yD3Yxz0reJtwuTs",
    authDomain: "essencialmente-psicologia.firebaseapp.com",
    projectId: "essencialmente-psicologia",
    storageBucket: "essencialmente-psicologia.firebasestorage.app",
    messagingSenderId: "908412673464",
    appId: "1:908412673464:web:d838e6b1e8cc7a07ff434d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const functionsApp = getFunctions(app, "us-central1");

  const loginBox = document.getElementById("login-box");
  const painel = document.getElementById("painel");
  const btnSair = document.getElementById("btn-sair");
  const loginErro = document.getElementById("login-erro");

  document.getElementById("btn-entrar").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    loginErro.style.display = "none";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      console.error(err);
      loginErro.style.display = "block";
    }
  });

  btnSair.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      loginBox.style.display = "block";
      painel.classList.remove("ativo");
      btnSair.style.display = "none";
      return;
    }

    // Descobrir o papel (role) do utilizador — o ID do documento em "psicologos"
    // deve ser igual ao UID da conta de autenticação
    const perfilRef = doc(db, "psicologos", user.uid);
    let perfilSnap;
    try {
      perfilSnap = await getDoc(perfilRef);
    } catch (erroLeitura) {
      loginErro.textContent = "Erro técnico ao ler o perfil: " + erroLeitura.message + " (UID usado: " + user.uid + ")";
      loginErro.style.display = "block";
      await signOut(auth);
      return;
    }

    if (!perfilSnap.exists()) {
      loginErro.textContent = "Não encontrei o documento em psicologos/" + user.uid + ". Confirma que o ID do documento no Firestore é exatamente este UID.";
      loginErro.style.display = "block";
      await signOut(auth);
      return;
    }

    const perfil = perfilSnap.data();
    const role = perfil.role || "psicologo";

    loginBox.style.display = "none";
    painel.classList.add("ativo");
    btnSair.style.display = "inline-block";

    document.getElementById("resumo-utilizador").textContent =
      role === "admin"
        ? `Sessão de administrador (${perfil.nome || user.email}) — a ver todas as consultas.`
        : `Sessão de ${perfil.nome || user.email} — a ver as tuas consultas.`;

    document.getElementById("bloco-admin").style.display = role === "admin" ? "block" : "none";

    carregarConsultas(role, user.uid);
  });

  document.getElementById("btn-criar-psicologo").addEventListener("click", async () => {
    const msg = document.getElementById("msg-criar");
    msg.style.color = "var(--ink)";
    msg.textContent = "A criar...";

    const dados = {
      nome: document.getElementById("novo-nome").value.trim(),
      email: document.getElementById("novo-email").value.trim(),
      password: document.getElementById("novo-password").value,
      especialidade: document.getElementById("novo-especialidade").value.trim(),
      role: document.getElementById("novo-role").value,
    };

    if (!dados.nome || !dados.email || !dados.password) {
      msg.style.color = "#b3452c";
      msg.textContent = "Preenche pelo menos nome, email e palavra-passe.";
      return;
    }

    try {
      // Força a renovação do token de autenticação antes de chamar a function,
      // para garantir que o pedido chega autenticado
      await auth.currentUser.getIdToken(true);
      const criarPsicologo = httpsCallable(functionsApp, "criarPsicologo");
      const resultado = await criarPsicologo(dados);
      msg.style.color = "#3c5a2f";
      msg.textContent = `Psicólogo criado com sucesso (UID: ${resultado.data.uid}).`;
      document.getElementById("novo-nome").value = "";
      document.getElementById("novo-email").value = "";
      document.getElementById("novo-password").value = "";
      document.getElementById("novo-especialidade").value = "";
    } catch (err) {
      console.error(err);
      msg.style.color = "#b3452c";
      msg.textContent = "Erro: " + err.message;
    }
  });

  async function carregarConsultas(role, psicologoId) {
    const corpo = document.getElementById("lista-consultas");
    const vazio = document.getElementById("vazio");
    corpo.innerHTML = "";

    let consultasQuery;
    if (role === "admin") {
      consultasQuery = query(collection(db, "consultas"), orderBy("data", "desc"));
    } else {
      consultasQuery = query(collection(db, "consultas"), where("psicologoId", "==", psicologoId), orderBy("data", "desc"));
    }

    try {
      const snap = await getDocs(consultasQuery);
      if (snap.empty) {
        vazio.style.display = "block";
        return;
      }
      snap.forEach(docSnap => {
        const c = docSnap.data();
        window.consultasCache[docSnap.id] = c;

        const tr = document.createElement("tr");
        tr.className = "linha-consulta";
        tr.dataset.id = docSnap.id;
        const naoVista = !c.visualizada;
        tr.innerHTML = `
          <td>${c.data || "-"}</td>
          <td>${c.hora || "-"}</td>
          <td>${naoVista ? '<span class="badge-novo"></span>' : ''}${c.clienteNome || "-"}</td>
          <td>${c.clienteEmail || "-"}</td>
          <td>${c.clienteTelefone || "-"}</td>
          <td>${c.psicologoNome || "-"}</td>
          <td>${c.tipo || "-"}</td>
          <td><span class="estado estado-${c.estado || "confirmada"}">${c.estado || "confirmada"}</span></td>
        `;
        tr.addEventListener("click", () => abrirDetalhes(docSnap.id));
        corpo.appendChild(tr);
      });
    } catch (err) {
      console.error("Erro ao carregar consultas:", err);
      vazio.textContent = "Não foi possível carregar as consultas.";
      vazio.style.display = "block";
    }
  }

  window.consultasCache = {};
  let consultaAtualId = null;

  async function abrirDetalhes(id) {
    const c = window.consultasCache[id];
    if (!c) return;
    consultaAtualId = id;

    document.getElementById("d-nome").textContent = c.clienteNome || "-";
    document.getElementById("d-email").textContent = c.clienteEmail || "-";
    document.getElementById("d-telefone").textContent = c.clienteTelefone || "-";
    document.getElementById("d-psicologo").textContent = c.psicologoNome || "-";
    document.getElementById("d-tipo").textContent = c.tipo || "-";
    document.getElementById("d-datahora").textContent = `${c.data || "-"} às ${c.hora || "-"}`;
    document.getElementById("d-estado").textContent = c.estado || "confirmada";
    document.getElementById("d-nota").value = c.notaInterna || "";
    document.getElementById("msg-nota").textContent = "";

    document.getElementById("modal-fundo").classList.add("ativo");

    // Marca como visualizada, se ainda não estava
    if (!c.visualizada) {
      try {
        await updateDoc(doc(db, "consultas", id), { visualizada: true });
        c.visualizada = true;
        window.consultasCache[id] = c;
        const linha = document.querySelector(`tr[data-id="${id}"] .badge-novo`);
        if (linha) linha.remove();
      } catch (err) {
        console.error("Erro ao marcar como visualizada:", err);
      }
    }
  }

  document.getElementById("btn-fechar-modal").addEventListener("click", () => {
    document.getElementById("modal-fundo").classList.remove("ativo");
  });

  document.getElementById("btn-guardar-nota").addEventListener("click", async () => {
    if (!consultaAtualId) return;
    const msg = document.getElementById("msg-nota");
    const nota = document.getElementById("d-nota").value;
    msg.style.color = "var(--ink)";
    msg.textContent = "A guardar...";
    try {
      await updateDoc(doc(db, "consultas", consultaAtualId), { notaInterna: nota });
      window.consultasCache[consultaAtualId].notaInterna = nota;
      msg.style.color = "#3c5a2f";
      msg.textContent = "Nota guardada.";
    } catch (err) {
      console.error("Erro ao guardar nota:", err);
      msg.style.color = "#b3452c";
      msg.textContent = "Não foi possível guardar a nota.";
    }
  });
</script>

</body>
</html>
